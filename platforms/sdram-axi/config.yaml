# The SDRAM platform with the data cache and the AXI4 external bus (Memory repository,
# docs/DCACHE_AXI.md): the core's external port goes through a 4 KB write-through data cache for the
# SDRAM space, an AXI4 master, a router and two AXI4 slaves (the SDRAM and the peripheral
# window). The memory map is the one of the sdram platform. The cache writes every store through, so
# the host, which reads and writes the SDRAM through the debug port behind the cache, sees what the
# program wrote as soon as it wrote it; the last 4 KB of the SDRAM (the words the host shares with
# the program) bypass the cache; and the boot ROM invalidates the cache when a test ends, so the
# next program the host loads is not hidden by the lines of this one. Only what differs from sdram
# is written here.
extends: ../sdram/config.yaml

paths:
  boot_rom: ../TopLevel/platforms/sdram-axi/runtime/boot_rom.S
  boot_rom_linker_script: ../TopLevel/platforms/sdram-axi/runtime/boot_rom.ld

sim:
  toplevel: rv32im_sdram_axi_sim_test
  vhdl_sources:
    - ../Core/common/rv32i_ctrl_consts.vhd
    - ../Core/common/rv32im_pipeline_types.vhd
    - ../Core/common/genericRegister.vhd
    - ../Core/common/genericAdder.vhd
    - ../Core/common/genericAdderU.vhd
    - ../Core/common/genericMux2x1.vhd
    - ../Core/common/genericMux3x1.vhd
    - ../Core/common/FlipFlop.vhd
    - ../Core/I/ALU.vhd
    - ../Core/common/RegFile.vhd
    - ../Memory/sim/RAM_simulation.vhd
    - ../Memory/sim/ROM_simulation.vhd
    - ../Memory/external/sdram/sdram_pkg.vhd
    - ../Memory/external/sdram/sdram_ctrl.vhd
    - ../Memory/external/sdram/sdram_cpu_bridge.vhd
    - ../Memory/external/sdram/sdram_arbiter.vhd
    - ../Memory/external/sdram/sdram_dbg_master.vhd
    - ../Memory/external/sdram/sdram_jtag_core.vhd
    - ../Memory/external/sdram/sim/sdram_model.vhd
    - ../Memory/external/sdram/sim/sdram_system.vhd
    - ../Memory/external/bus/jtag_uart.vhd
    - ../Memory/external/cache/icache.vhd
    - ../Memory/external/axi/axi_master_bridge.vhd
    - ../Memory/external/axi/axi_slave_word_bridge.vhd
    - ../Memory/external/axi/axi_slave_periph_bank.vhd
    - ../Memory/external/axi/axi_router.vhd
    - ../Memory/external/cache/dcache.vhd
    - ../Memory/external/axi/ext_axi_interconnect.vhd
    - ../Core/common/InstructionDecoder.vhd
    - ../Core/I/ExtenderImm.vhd
    - ../Core/I/ExtenderRAM.vhd
    - ../Core/I/StoreManager.vhd
    - ../TopLevel/platforms/internal-mem/rtl/clk_gen_3way.vhd
    - ../Core/common/control_unit.vhd
    - ../Core/common/bubble_mux.vhd
    - ../Core/common/forwarding_unit.vhd
    - ../Core/common/hazard_detection_unit.vhd
    - ../Core/common/extendSigned.vhd
    - ../Core/M/decoderM.vhd
    - ../Core/M/m_decode.vhd
    - ../Core/M/booth_multiplier_rv32.vhd
    - ../Core/M/non_restoring_divider_rv32.vhd
    - ../Core/M/mult.vhd
    - ../Core/M/div.vhd
    - ../Core/M/divu.vhd
    - ../Core/M/multdiv.vhd
    - ../Core/Zicsr/csr_decode.vhd
    - ../Core/Zicsr/csr_file.vhd
    - ../Core/Zicsr/trap_unit.vhd
    - ../Core/Zifencei/fencei_unit.vhd
    - ../Core/common/pc_fetch.vhd
    - ../Core/common/reg_IF_ID.vhd
    - ../Core/common/reg_ID_EX.vhd
    - ../Core/common/reg_EX_MEM.vhd
    - ../Core/common/reg_MEM_WB.vhd
    - ../Core/cores/rv32im_pipeline_core.vhd
    - ../TopLevel/platforms/sdram-axi/rtl/rv32im_sdram_axi_sim_test.vhd
  test_module: testbench.test_c_program
  python_path:
    - ../TopLevel/platforms/sdram
  # The testbench also drives the SDRAM clock (7 ns, no relation to the core clock), and the SDRAM's
  # power-up wait (200 us) comes before the first access: ticks of CLK are counted for the timeout,
  # so it is longer than internal-mem's.
  env:
    SIM_EXTRA_CLOCKS: "CLK_MEM:7"
    SIM_SAMPLE_CLOCK: pll_clk_idexmem
    SIM_TIMEOUT_CYCLES: "600000"
