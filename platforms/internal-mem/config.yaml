# Configuration for the RISC-V test build/run pipeline.
#
# The "real" side is wired to ../tests/FPGA/core/quartus
# (core_fpga_test.qpf) — the only working core + Quartus project on
# this workstation. Lines still marked "<<< ADJUST" depend on things
# that vary per machine/runner (which JTAG cable, which self-hosted
# runner labels) — see README.md.

toolchain:
  # riscv-collab/riscv-gnu-toolchain (elf/newlib variant). CI always
  # pulls the latest nightly rather than pinning a tag, since the
  # project has no "stable" release and this is the same toolchain
  # used in production. See README.md.
  gcc: riscv32-unknown-elf-gcc
  objcopy: riscv32-unknown-elf-objcopy

isa:
  base: i                    # always implied, never written in a test's header
  default_ext: ""            # no "// RV32_EXT:" header -> plain rv32i
  # Canonical order standard RISC-V extension letters get sorted into
  # before being appended to the base ISA string, so "// RV32_EXT: A,M"
  # and "// RV32_EXT: M,A" both normalize to rv32ima.
  canonical_order: "MAFDQLCBJTPVNH"

memory:
  # rv32im_pipeline_core is Harvard MODIFICADO: ROM and RAM are still
  # two physically independent BRAMs (rom_addr/ram_addr are separate
  # buses), but the ROM has a second read port wired to the MEM stage
  # (rom2port.vhd) and the two now share ONE non-overlapping address
  # space, decoded by bit 16 (is_rom_data in
  # rv32im_pipeline_core.vhd): 0x00000000-0x0000FFFF = ROM,
  # 0x00010000-0x0001FFFF = RAM. This is what lets a `lw` reach ROM at
  # all — see docs/DATA_HARVARD_BUG.md for why that used to be
  # impossible.
  rom_base: 0x00000000
  rom_words: 16384       # ROM2PORT: numwords_a/b=16384, widthad_a/b=14 (see rom2port.vhd)
  ram_base: 0x00010000
  ram_words: 16384        # RAM1PORT: numwords_a=16384, widthad_a=14 (see ram1port.vhd)
  # Last word of RAM, reserved for the PASS/FAIL mailbox (see
  # tools/riscv_build/include/rv32_test.h). Must stay in sync with
  # link.ld's RAM length below.
  mailbox_addr: 0x0001FFFC
  # Second-to-last word: the "go" flag crt0.S's restart loop polls.
  # Writing a nonzero word here over JTAG (after loading a new ROM
  # image, without reprogramming the FPGA) makes the core jump back to
  # _start and run it — see the "no full recompile per test" note
  # under quartus: below.
  go_flag_addr: 0x0001FFF8

paths:
  include_dir: tools/riscv_build/include
  crt0: tools/riscv_build/crt0.S
  linker_script: tools/riscv_build/link.ld
  build_dir: build
  c_dir: c
  asm_dir: asm

quartus:
  # Points at RV32IM's real project — this repo (RISC-V-Workstation-
  # Tests) is vendored as RV32IM's own Tests/ submodule, so RV32IM's
  # root is one level up from this project's own root.
  project_dir: ../tests/FPGA/core/quartus
  project_name: core_fpga_test                     # core_fpga_test.qpf/.qsf
  sof_file: output_files/core_fpga_test.sof         # relative to project_dir
  # Path (relative to project_dir) the ROM IP reads its initial
  # contents from at synthesis time. build_fpga.py overwrites this
  # file and recompiles the whole project for every test.
  #
  # NOT ips/ROM1PORT/init.mif (that's just where the IP's own template
  # copy lives) — rom1port.vhd's init_file generic is the literal
  # string "./init.mif", resolved relative to quartus_sh's cwd
  # (project_dir) at compile time, i.e. the top-level file here.
  # Confirmed by dumping the ROM back over JTAG after overwriting the
  # ips/ copy: the board kept running an unrelated stale program
  # (word9 == 0xDEAD0137, a leftover from some earlier experiment)
  # until this was pointed at the right file.
  rom_mif_target: init.mif
  # jtag_hardware isn't configured here: the "USB-Blaster [<bus>-<port>]"
  # suffix reflects USB topology and drifts across reboots/hub
  # renumbering (seen firsthand: "[1-4]" became "[1-10]" between two
  # runs on this same machine) — build_fpga.py detects it live via
  # `jtagconfig` instead. jtag_device is the FPGA's own JTAG IDCODE,
  # which doesn't change:
  jtag_device: "@1: 5CE(BA4|FA4) (0x02B050DD)"
  # Instance indices Quartus' In-System Memory Content Editor assigns
  # to the ROM/RAM debug taps, in declaration order in the project
  # (see core_fpga_test.vhd: ROM instantiated first (0), RAM second
  # (1) — matches the RV32IM Makefile's own loadROM.tcl/
  # dumpMemory.tcl, which already use 0/1 the same way). The mailbox
  # lives inside RAM, so it shares RAM's instance index.
  #
  # Harvard modificado: ROM_MEM (the second physical ROM copy backing
  # the MEM stage's read port — see
  # ips/ROM1PORT_MEM/rom1port_mem.vhd) is instantiated LAST, after
  # RAM, specifically so it doesn't shift RAM's already-relied-on
  # index of 1 — it picks up whatever index comes next (2). Verify
  # against the real quartus_map/fitter report if this project's
  # instantiation order in core_fpga_test.vhd ever changes.
  rom_mem_instances: [0, 2]
  mailbox_mem_instance: 1
  ram_mem_instance: 1
  # Fallback only: build_fpga.py compiles + quartus_pgm's ONCE, then
  # per test just JTAG-writes the new ROM image + pulses go_flag_addr
  # (crt0.S jumps back to _start on its own — no recompile, no
  # reprogram). This full flow — quartus_sh --flow compile, then
  # quartus_pgm — only runs again if a test's mailbox never responds
  # within its timeout (see build_tests.py's RV32_TIMEOUT_S header),
  # as a recovery path.
  program_wait_seconds: 15
  # How often to poll the mailbox while waiting (see
  # default_timeout_s / a test's own RV32_TIMEOUT_S header). Each poll
  # is its own quartus_stp subprocess (a fresh JTAG/In-System Memory
  # Editor session, opened and closed from scratch) — 0.5s let a
  # 15s-timeout test issue up to ~30 of these back to back, and that
  # volume of rapid session churn turned out to be unreliable on this
  # board (a genuine PASS/FAIL already sitting in the mailbox was
  # missed, reported as "no mailbox result" instead — see
  # docs/DATA_HARVARD_BUG.md for how this was found and confirmed by
  # reading the same mailbox manually, once, with a real gap, and
  # getting the answer immediately). Fewer, more spaced-out polls
  # trade a bit of detection latency for reliability.
  poll_interval_seconds: 2.5
  # Default per-test timeout if a test doesn't set RV32_TIMEOUT_S.
  default_timeout_s: 15

sim:
  # Full-pipeline GHDL simulation top — NOT core_fpga_test (the real
  # hardware top): that one instantiates the real Quartus ROM1PORT/
  # RAM1PORT IP (altsyncram-based), which GHDL/cocotb can't peek
  # inside. rv32i3stage_core_sim_test instantiates ROM_simulation/
  # RAM_simulation instead — plain VHDL arrays cocotb can read.
  toplevel: rv32i3stage_core_sim_test
  # In dependency order (verified against tests/python/tests.json in
  # this same repo, which already builds this exact toplevel from
  # this exact source list for its instruction-level tests). Relative
  # to this project's own root, not RV32IM's (see quartus.project_dir
  # above for how the two relate).
  vhdl_sources:
    - ../src/rv32i_ctrl_consts.vhd
    - ../src/rv32im_pipeline_types.vhd
    - ../src/genericRegister.vhd
    - ../src/genericAdder.vhd
    - ../src/genericAdderU.vhd
    - ../src/genericMux2x1.vhd
    - ../src/genericMux3x1.vhd
    - ../src/FlipFlop.vhd
    - ../src/ALU.vhd
    - ../src/RegFile.vhd
    - ../src/RAM_simulation.vhd
    - ../src/ROM_simulation.vhd
    - ../src/InstructionDecoder.vhd
    - ../src/ExtenderImm.vhd
    - ../src/ExtenderRAM.vhd
    - ../src/StoreManager.vhd
    - ../src/clk_gen_3way.vhd
    - ../src/control_unit.vhd
    - ../src/bubble_mux.vhd
    - ../src/forwarding_unit.vhd
    - ../src/hazard_detection_unit.vhd
    - ../src/extendSigned.vhd
    - ../src/decoderM.vhd
    - ../src/booth_multiplier_rv32.vhd
    - ../src/non_restoring_divider_rv32.vhd
    - ../src/mult.vhd
    - ../src/div.vhd
    - ../src/divu.vhd
    - ../src/multdiv.vhd
    - ../src/pc_fetch.vhd
    - ../src/reg_IF_ID.vhd
    - ../src/reg_ID_EX.vhd
    - ../src/reg_EX_MEM.vhd
    - ../src/reg_MEM_WB.vhd
    - ../src/rv32im_pipeline_core.vhd
    - ../src/rv32i3stage_core_sim_test.vhd
  test_module: tools.riscv_build.sim.test_c_program
  ghdl_std: "08"
  # ROM_simulation reads its program image via a VHDL generic (a
  # file-open process inside the VHDL itself), not sim_runner's own
  # ROM_HEX env var — see rv32i3stage_core_sim_test.vhd. The
  # rom_addr_width/ram_addr_width generics size ROM_simulation/
  # RAM_simulation's memory arrays to match memory.rom_words/
  # ram_words above (2**13=8192, 2**12=4096) — both default to 2**9
  # (512 words) inside rv32i3stage_core_sim_test.vhd, too small to
  # hold mailbox_addr (word offset 4095).
  parameters:
    ROM_FILE: "{hex_path}"
    # 64K ROM / 64K RAM (Harvard modificado, ver docs/ -- plano em
    # andamento) -- 16384 palavras cada, 14 bits de indice.
    rom_addr_width: "14"
    ram_addr_width: "14"
