# The memory map of the platform on the board (Cyclone V 5CEBA4F23, memories
# inside the FPGA): the source of truth `riscv-tools check-memory-map` checks
# every hand-written copy against.
#
#   uv run riscv-tools --root . check-memory-map --platform platforms/internal-mem.yaml
#
# Paths in `checks` are relative to the root. `../src` is RV32IM's src (this
# repo is RV32IM's Tests/ submodule; CI links it the same way). Files that
# exist only in RV32IM's tree are `optional`.
platform: internal-mem
profile: rv32im

regions:
  - {name: BOOT_ROM, base: 0x00000000, size: 2K,   kind: rom, exec: true}
  - {name: FLASH,    base: 0x00000800, size: 30K,  kind: rom, exec: true}
  - {name: RAM,      base: 0x00008000, size: 160K, kind: ram}

# Words at the top of RAM: the contract between the boot ROM, the program and
# the host (platform/boot_rom.S clears them at every reset).
reserved:
  stdout:   {base: 0x0002FBE0, size: 1K+8}
  tohost:   {base: 0x0002FFE8, size: 8}
  fromhost: {base: 0x0002FFF0, size: 8}
  go_flag:  {base: 0x0002FFF8, size: 4}
  mailbox:  {base: 0x0002FFFC, size: 4}

boot:
  entry: 0x00000800
  wait_restart: 0x00000100

peripherals: []

checks:
  # --- config.yaml ---------------------------------------------------------
  - {name: config boot_rom_base, file: tools/riscv_build/config.yaml, yaml: memory.boot_rom_base, expect: BOOT_ROM.base}
  - {name: config boot_rom_words, file: tools/riscv_build/config.yaml, yaml: memory.boot_rom_words, expect: BOOT_ROM.words}
  - {name: config rom_base, file: tools/riscv_build/config.yaml, yaml: memory.rom_base, expect: FLASH.base}
  - {name: config rom_words, file: tools/riscv_build/config.yaml, yaml: memory.rom_words, expect: FLASH.words}
  - {name: config ram_base, file: tools/riscv_build/config.yaml, yaml: memory.ram_base, expect: RAM.base}
  - {name: config ram_words, file: tools/riscv_build/config.yaml, yaml: memory.ram_words, expect: RAM.words}
  - {name: config mailbox_addr, file: tools/riscv_build/config.yaml, yaml: memory.mailbox_addr, expect: mailbox.base}
  - {name: config go_flag_addr, file: tools/riscv_build/config.yaml, yaml: memory.go_flag_addr, expect: go_flag.base}
  - {name: config sim boot_rom_addr_width, file: tools/riscv_build/config.yaml, yaml: sim.parameters.boot_rom_addr_width, expect: clog2(BOOT_ROM.words)}
  - {name: config sim rom_addr_width, file: tools/riscv_build/config.yaml, yaml: sim.parameters.rom_addr_width, expect: clog2(FLASH.words)}
  - {name: config sim ram_addr_width, file: tools/riscv_build/config.yaml, yaml: sim.parameters.ram_addr_width, expect: clog2(RAM.words)}

  # --- linker flags (rv32im-fpga.specs) ------------------------------------
  - {name: specs __flash, file: rv32im-fpga.specs, pattern: '--defsym=__flash=(\S+)', expect: FLASH.base}
  - {name: specs __flash_size, file: rv32im-fpga.specs, pattern: '--defsym=__flash_size=(\S+)', expect: FLASH.size}
  - {name: specs __ram, file: rv32im-fpga.specs, pattern: '--defsym=__ram=(\S+)', expect: RAM.base}
  # The linker's RAM stops where the reserved words begin.
  - {name: specs __ram_size, file: rv32im-fpga.specs, pattern: '--defsym=__ram_size=(\S+)', expect: stdout.base - RAM.base}
  - {name: specs rv32_wait_restart, file: rv32im-fpga.specs, pattern: 'rv32_wait_restart=(\S+?)\s*\}?\s*$', expect: boot.wait_restart}

  # --- boot ROM ------------------------------------------------------------
  - {name: boot_rom.ld origin, file: platform/boot_rom.ld, pattern: 'boot_rom \(rx\) : ORIGIN = (\S+),', expect: BOOT_ROM.base}
  - {name: boot_rom.ld length, file: platform/boot_rom.ld, pattern: 'LENGTH = (\w+)\s*$', expect: BOOT_ROM.size}
  - {name: boot_rom.ld RESET_RESERVED, file: platform/boot_rom.ld, pattern: 'RESET_RESERVED = (\S+);', expect: boot.wait_restart}
  - {name: boot_rom.S RAM end, file: platform/boot_rom.S, pattern: '^\s*li\s+t0,\s*(0x[0-9A-Fa-f]+)\s*$', expect: RAM.end}
  - {name: boot_rom.S stdout header, file: platform/boot_rom.S, pattern: 'li\s+t0,\s*(0x[0-9A-Fa-f]+)\s*// stdout header', expect: stdout.base}
  - {name: boot_rom.S FLASH_BASE, file: platform/boot_rom.S, pattern: 'li\s+t0,\s*(0x[0-9A-Fa-f]+)\s*// FLASH_BASE', expect: boot.entry}
  - {name: boot_rom.S mailbox offset, file: platform/boot_rom.S, pattern: '(-\d+)\(t0\)\s*// mailbox', expect: mailbox.base - RAM.end}
  - {name: boot_rom.S go flag offset, file: platform/boot_rom.S, pattern: '(-\d+)\(t0\)\s*// go flag', expect: go_flag.base - RAM.end}
  - {name: boot_rom.S fromhost offset, file: platform/boot_rom.S, pattern: '(-\d+)\(t0\)\s*// fromhost', expect: fromhost.base - RAM.end}
  - {name: boot_rom.S tohost offset, file: platform/boot_rom.S, pattern: '(-\d+)\(t0\)\s*// tohost', expect: tohost.base - RAM.end}

  # --- runtime and Spike stand-in ------------------------------------------
  - {name: _exit.c mailbox, file: platform/_exit.c, pattern: '\*\(volatile unsigned int \*\)(0x[0-9A-Fa-f]+)u', expect: mailbox.base}
  - {name: stdio.c STDOUT_BASE, file: platform/stdio.c, pattern: '#define STDOUT_BASE (0x[0-9A-Fa-f]+)u', expect: stdout.base}
  - {name: spike_exit.S tohost, file: platform/spike_exit.S, pattern: '\.equ tohost, (\S+)', expect: tohost.base}
  - {name: spike_exit.S fromhost, file: platform/spike_exit.S, pattern: '\.equ fromhost, (\S+)', expect: fromhost.base}
  - {name: spike_exit.S RAM end, file: platform/spike_exit.S, pattern: '^\s*li\s+t0,\s*(0x[0-9A-Fa-f]+)\s*$', expect: RAM.end}
  - {name: spike_exit.S mailbox offset, file: platform/spike_exit.S, pattern: '(-\d+)\(t0\)\s*// mailbox', expect: mailbox.base - RAM.end}
  - {name: spike_exit.S tohost offset, file: platform/spike_exit.S, pattern: '(-\d+)\(t0\)\s*// tohost', expect: tohost.base - RAM.end}
  - {name: rv32_test.h mailbox, file: tools/riscv_build/include/rv32_test.h, pattern: 'RV32_MAILBOX_ADDR \(\(volatile unsigned int \*\)(0x[0-9A-Fa-f]+)\)', expect: mailbox.base}

  # --- VHDL of the core ----------------------------------------------------
  - {name: core BOOT_ROM_SIZE_BYTES, file: ../src/rv32im_pipeline_core.vhd, pattern: 'BOOT_ROM_SIZE_BYTES\s*:\s*unsigned\(31 downto 0\)\s*:=\s*to_unsigned\((16#[0-9A-Fa-f]+#)', expect: BOOT_ROM.size}
  - {name: core RAM_BASE_BYTES, file: ../src/rv32im_pipeline_core.vhd, pattern: 'RAM_BASE_BYTES\s*:\s*unsigned\(31 downto 0\)\s*:=\s*to_unsigned\((16#[0-9A-Fa-f]+#)', expect: RAM.base}

  # --- Quartus IPs (only in RV32IM's tree) ---------------------------------
  - {name: BOOT_ROM IP numwords, file: ../tests/FPGA/core/quartus/ips/BOOT_ROM1PORT/boot_rom1port.vhd, optional: true, pattern: 'numwords_a => (\d+)', expect: BOOT_ROM.words}
  - {name: BOOT_ROM IP widthad, file: ../tests/FPGA/core/quartus/ips/BOOT_ROM1PORT/boot_rom1port.vhd, optional: true, pattern: 'widthad_a => (\d+)', expect: clog2(BOOT_ROM.words)}
  - {name: FLASH IP numwords, file: ../tests/FPGA/core/quartus/ips/FLASH1PORT/flash1port.vhd, optional: true, pattern: 'numwords_a => (\d+)', expect: FLASH.words}
  - {name: FLASH IP widthad, file: ../tests/FPGA/core/quartus/ips/FLASH1PORT/flash1port.vhd, optional: true, pattern: 'widthad_a => (\d+)', expect: clog2(FLASH.words)}
  - {name: FLASH_MEM IP numwords, file: ../tests/FPGA/core/quartus/ips/FLASH_MEM1PORT/flash_mem1port.vhd, optional: true, pattern: 'numwords_a => (\d+)', expect: FLASH.words}
  - {name: FLASH_MEM IP widthad, file: ../tests/FPGA/core/quartus/ips/FLASH_MEM1PORT/flash_mem1port.vhd, optional: true, pattern: 'widthad_a => (\d+)', expect: clog2(FLASH.words)}
  - {name: RAM IP numwords, file: ../tests/FPGA/core/quartus/ips/RAM1PORT/ram1port.vhd, optional: true, pattern: 'numwords_a => (\d+)', expect: RAM.words}
  - {name: RAM IP widthad, file: ../tests/FPGA/core/quartus/ips/RAM1PORT/ram1port.vhd, optional: true, pattern: 'widthad_a => (\d+)', expect: clog2(RAM.words)}
