    - ../Memory/external/bus/seg_display.vhd
    - ../Memory/external/bus/ext_interconnect.vhd
    - ../TopLevel/platforms/internal-mem/rtl/clk_gen_3way.vhd
    - ../TopLevel/platforms/sdram-flash/rtl/rv32im_sdram_flash_sim_test.vhd
  parameters:
    HAS_ZIFENCEI: true
    HAS_ZIHPM: true
    # the storage model of the FLASH is 256 KB (65536 words, 16 bits): the chip window is 1 MB, the model
    # array is smaller because a larger one does not run in GHDL; the programs are far smaller
    rom_addr_width: "16"

quartus:
  project_dir: ../TopLevel/platforms/sdram-flash/quartus
  project_name: core_fpga_sdram_flash
  sof_file: output_files/core_fpga_sdram_flash.sof
  rom_mif_target: flash_init.mif
  boot_rom_mif_target: boot_rom_init.mif
  # The memory editor sees BOOT_ROM (0) and the FLASH storage (1); the SDRAM is reached through the debug port.
  rom_mem_instances: [1]
